server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Required for parallel RAW decoding; preserve these headers behind a host reverse proxy.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /star-color {
        return 301 /star-color/;
    }

    location /star-color/assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location /star-color/luma/ {
        try_files $uri =404;
        expires 1y;
    }

    location /star-color/ {
        try_files $uri $uri/ /star-color/index.html;
        expires -1;
    }

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/wasm wasm;
        image/png png;
    }
}
